name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - '*.go'
      - 'cmd/**'
      - 'internal/**'
      - 'bundle/**'
      - 'go.mod'
      - 'go.sum'
      - 'apps/pwa/**'
      - 'apps/web/public/fonts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose the release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already tagged; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Releasing $next (previous: ${latest:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.tag.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - name: Install tmux and jq
        if: steps.tag.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux jq
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          run_install: false
      - name: Build and embed the phone app
        if: steps.tag.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile
          make pwa-build
          make pwa-embed
      - if: steps.tag.outputs.skip != 'true'
        run: go test ./...
      - name: Build the four binaries
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/factory_${os}_${arch}" ./cmd/factory
          done
      - name: Check that every binary carries the phone app
        if: steps.tag.outputs.skip != 'true'
        run: |
          stamp=$(jq -r .version apps/pwa/dist/build.json)
          for binary in dist/factory_*; do
            grep -q "shell-$stamp" "$binary" || { echo "$binary lacks the phone app $stamp"; exit 1; }
          done
      - name: Publish the release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes

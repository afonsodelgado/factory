set -g prefix None
set -g prefix2 None
set -g mouse on
set -g history-limit 50000
set -g status-style bg=default,fg=default
set -s escape-time 0
set -s focus-events on
set -s extended-keys on
set -s set-clipboard on
set -s terminal-features[90] 'xterm*:RGB:extkeys'
set -s terminal-features[91] 'tmux*:RGB:extkeys'
set -s terminal-features[92] 'screen*:RGB:extkeys'
